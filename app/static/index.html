<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI MongoDB CRUD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 700px; }
    form { display: grid; gap: 0.5rem; margin-bottom: 1.5rem; }
    input, textarea, button { font-size: 1rem; padding: 0.5rem; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #ddd; margin-bottom: 0.5rem; padding: 0.75rem; }
    .actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
  </style>
</head>
<body>
  <h1>FastAPI + MongoDB CRUD</h1>

  <form id="item-form">
    <input id="title" name="title" placeholder="Title" required />
    <textarea id="description" name="description" placeholder="Description"></textarea>
    <button type="submit">Save Item</button>
  </form>

  <ul id="items"></ul>

  <script>
    const form = document.getElementById('item-form');
    const titleInput = document.getElementById('title');
    const descriptionInput = document.getElementById('description');
    const list = document.getElementById('items');

    let editingId = null;

    async function fetchItems() {
      const response = await fetch('/api/items');
      const items = await response.json();
      list.innerHTML = '';

      items.forEach((item) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>${item.title}</strong>
          <p>${item.description || ''}</p>
          <div class="actions">
            <button type="button" data-action="edit" data-id="${item.id}">Edit</button>
            <button type="button" data-action="delete" data-id="${item.id}">Delete</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        title: titleInput.value.trim(),
        description: descriptionInput.value.trim()
      };

      if (!payload.title) {
        return;
      }

      if (editingId) {
        await fetch(`/api/items/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        editingId = null;
      } else {
        await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      form.reset();
      await fetchItems();
    });

    list.addEventListener('click', async (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;

      if (action === 'delete') {
        await fetch(`/api/items/${id}`, { method: 'DELETE' });
        await fetchItems();
      }

      if (action === 'edit') {
        const response = await fetch(`/api/items/${id}`);
        if (!response.ok) return;
        const item = await response.json();
        titleInput.value = item.title;
        descriptionInput.value = item.description;
        editingId = item.id;
      }
    });

    fetchItems();
  </script>
</body>
</html>
